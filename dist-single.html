<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SempreViva Labs</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap');</style>
<style>/* ============================================================
   SempreViva Labs
   Concept: the everlasting flower. Preserved, then reconstituted.
   ============================================================ */



:root{
  --paper:#F5F1E8;
  --paper-deep:#E8E1CE;
  --glass:#FBF8F2;
  --ink:#12304A;
  --ink-soft:#3A5769;
  --ink-mute:#72899A;
  --gold:#C2172E;
  --gold-lift:#A31324;
  --sage:#5E7A8C;
  --sage-pale:#B7C6D1;
  --rust:#9B2233;
  --rule:#DCD5C5;
  --rule-fine:#E9E3D5;

  --display:'Playfair Display',Georgia,serif;
  --sans:'Public Sans',system-ui,-apple-system,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;

  --measure:68ch;
  --gut:clamp(20px,4vw,56px);
  --shell:1240px;
  --ease:cubic-bezier(.2,.7,.3,1);
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16.5px;line-height:1.6;font-weight:400;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;}
button{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px;}

h1,h2,h3,h4{
  font-family:var(--display);font-weight:400;
  line-height:1.08;letter-spacing:-.012em;margin:0;
  text-wrap:balance;
}
h1{font-size:clamp(2.7rem,6.4vw,5.1rem);}
h2{font-size:clamp(1.85rem,3.4vw,2.85rem);}
h3{font-size:clamp(1.2rem,1.9vw,1.5rem);}
p{margin:0 0 1.05em;max-width:var(--measure);}
p:last-child{margin-bottom:0;}

.shell{max-width:var(--shell);margin:0 auto;padding:0 var(--gut);}
.narrow{max-width:840px;}
.stack>*+*{margin-top:var(--sp,20px);}
.hide{display:none!important;}

/* ---------- numeric / assay type ---------- */
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}

/* ---------- build banner ---------- */
.buildbar{
  background:var(--rust);color:#F6EFE9;font-size:12.5px;line-height:1.45;
  padding:9px var(--gut);display:flex;gap:14px;align-items:baseline;justify-content:center;
  flex-wrap:wrap;text-align:center;
}
.buildbar b{font-weight:600;}

/* ---------- header ---------- */
.masthead{
  position:sticky;top:0;z-index:60;background:rgba(233,236,229,.93);
  backdrop-filter:saturate(1.2) blur(9px);border-bottom:1px solid var(--rule);
}
.masthead-in{display:flex;align-items:center;gap:28px;height:68px;}
.wordmark{display:flex;align-items:baseline;gap:9px;text-decoration:none;margin-right:auto;}
.wordmark .mark{
  font-family:var(--display);font-size:1.34rem;letter-spacing:-.022em;
  font-weight:500;
}
.wordmark .inf{font-family:var(--display);color:var(--gold);font-size:1.15rem;line-height:1;}
.wordmark .sub{
  font-family:var(--mono);font-size:10px;color:var(--ink-mute);
  border-left:1px solid var(--rule);padding-left:9px;letter-spacing:.02em;
}
.nav{display:flex;gap:26px;align-items:center;}
.nav a{
  text-decoration:none;font-size:14.5px;color:var(--ink-soft);
  padding:4px 0;border-bottom:1px solid transparent;transition:color .18s,border-color .18s;
}
.nav a:hover{color:var(--ink);border-bottom-color:var(--gold);}
.nav a[aria-current]{color:var(--ink);border-bottom-color:var(--gold);}
.cartbtn{
  display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);
  border:0;padding:9px 15px;border-radius:1px;cursor:pointer;font-size:13.5px;
  text-decoration:none;transition:background .18s;
}
.cartbtn:hover{background:#0C1512;}
.cartbtn .n{font-family:var(--mono);font-size:12px;}
.navtoggle{display:none;background:none;border:1px solid var(--rule);padding:8px 11px;cursor:pointer;border-radius:1px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 24px;border-radius:1px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer;
  font-size:15px;transition:background .18s,color .18s,border-color .18s;
}
.btn:hover{background:#0C1512;border-color:#0C1512;}
.btn-ghost{background:transparent;color:var(--ink);}
.btn-ghost:hover{background:var(--ink);color:var(--paper);}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1B1404;}
.btn-gold:hover{background:var(--gold-lift);border-color:var(--gold-lift);}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.btn-sm{padding:9px 16px;font-size:13.5px;}

/* ---------- hero ---------- */
section.hero{border-bottom:1px solid var(--rule);padding:clamp(48px,7vw,84px) 0 0;}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,64px);align-items:end;}
.hero h1{margin-bottom:22px;}
.hero h1 em{font-style:italic;}
.hero-lede{font-size:clamp(1.02rem,1.35vw,1.16rem);color:var(--ink-soft);max-width:46ch;}
.hero-acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;}
.hero-meta{
  display:flex;gap:26px;flex-wrap:wrap;margin-top:34px;padding-top:20px;
  border-top:1px solid var(--rule);font-size:13px;color:var(--ink-mute);
}
.hero-meta div{display:flex;flex-direction:column;gap:3px;}
.hero-meta .v{font-family:var(--mono);font-size:15px;color:var(--ink);}

/* chromatogram */
.chroma{position:relative;background:var(--glass);border:1px solid var(--rule);padding:18px 18px 12px;}
.chroma-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:6px;}
.chroma-head .t{font-family:var(--mono);font-size:11px;color:var(--ink-mute);}
.chroma svg{width:100%;height:auto;display:block;}
.chroma .trace{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;}
.chroma .axis{stroke:var(--rule);stroke-width:1;}
.chroma .grid{stroke:var(--rule-fine);stroke-width:1;}
.chroma .peakfill{fill:rgba(168,121,27,.16);}
.chroma .callout{stroke:var(--gold);stroke-width:1;stroke-dasharray:3 3;}
.chroma-read{
  display:flex;align-items:baseline;gap:10px;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--rule-fine);
}
.chroma-read .big{font-family:var(--mono);font-size:2rem;letter-spacing:-.03em;line-height:1;}
.chroma-read .lbl{font-size:12.5px;color:var(--ink-mute);}
.chroma-foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);margin-top:8px;}

/* ---------- sections ---------- */
.sec{padding:clamp(56px,7.5vw,104px) 0;border-bottom:1px solid var(--rule);}
.sec-tight{padding:clamp(40px,5vw,64px) 0;}
.sec-head{max-width:62ch;margin-bottom:clamp(28px,4vw,46px);}
.sec-head p{color:var(--ink-soft);margin-top:14px;}
.dual{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(28px,5vw,72px);align-items:start;}

/* rail: mimics a certificate of analysis sidebar */
.rail{border-top:2px solid var(--ink);padding-top:14px;}
.rail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0;}
.rail dt{
  font-size:12.5px;color:var(--ink-mute);padding:9px 16px 9px 0;
  border-bottom:1px solid var(--rule-fine);white-space:nowrap;
}
.rail dd{
  margin:0;font-family:var(--mono);font-size:13px;text-align:right;
  padding:9px 0;border-bottom:1px solid var(--rule-fine);
}

/* ---------- specimen register (product list) ---------- */
.register{border-top:2px solid var(--ink);}
.spec{
  display:grid;grid-template-columns:64px 1fr auto auto;gap:0 20px;align-items:center;
  padding:20px 0;border-bottom:1px solid var(--rule-fine);position:relative;
  transition:background .16s;
}
.spec:hover{background:rgba(250,251,248,.7);}
.spec-idx{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);align-self:start;padding-top:4px;}
.spec-body{min-width:0;}
.spec-name{
  font-family:var(--display);font-size:1.32rem;line-height:1.15;letter-spacing:-.015em;
  text-decoration:none;display:inline-block;
  background-image:linear-gradient(var(--gold),var(--gold));
  background-size:0 1px;background-repeat:no-repeat;background-position:0 1.08em;
  transition:background-size .28s var(--ease);
}
.spec:hover .spec-name{background-size:100% 1px;}
.spec-class{font-size:13.5px;color:var(--ink-mute);margin-top:3px;max-width:56ch;}
.spec-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.tag{
  font-family:var(--mono);font-size:10.5px;color:var(--sage);
  border:1px solid var(--sage-pale);padding:2px 7px;border-radius:1px;
}
.tag-blend{color:var(--gold);border-color:rgba(168,121,27,.4);}
.spec-sizes{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);}
.spec-sizes .row{display:flex;gap:12px;}
.spec-sizes .mg{color:var(--ink-mute);}
.spec-buy{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.spec-price{font-family:var(--mono);font-size:1.25rem;letter-spacing:-.02em;}
.spec-price .from{font-family:var(--sans);font-size:11px;color:var(--ink-mute);display:block;text-align:right;}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:26px;}
.chip{
  background:transparent;border:1px solid var(--rule);padding:7px 14px;border-radius:1px;
  cursor:pointer;font-size:13.5px;color:var(--ink-soft);transition:all .16s;
}
.chip:hover{border-color:var(--ink-mute);color:var(--ink);}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.filter-count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-mute);}

/* ---------- cards where genuinely card-shaped ---------- */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:1px;background:var(--rule-fine);border:1px solid var(--rule-fine);}
.note{background:var(--paper);padding:26px 24px 28px;display:flex;flex-direction:column;gap:10px;text-decoration:none;transition:background .18s;}
.note:hover{background:var(--glass);}
.note .cat{font-family:var(--mono);font-size:10.5px;color:var(--gold);}
.note h3{font-size:1.16rem;line-height:1.2;}
.note p{font-size:14px;color:var(--ink-mute);margin:0;}
.note .more{margin-top:auto;padding-top:14px;font-size:13px;color:var(--sage);}

/* ---------- product detail ---------- */
.pd{display:grid;grid-template-columns:1fr 380px;gap:clamp(28px,4.5vw,64px);align-items:start;padding:clamp(36px,5vw,64px) 0;}
.pd-head{border-bottom:1px solid var(--rule);padding-bottom:22px;margin-bottom:26px;}
.pd-head h1{font-size:clamp(2.1rem,4.4vw,3.4rem);}
.pd-class{font-size:1.02rem;color:var(--ink-soft);margin-top:12px;}
.vial{
  background:var(--glass);border:1px solid var(--rule);padding:26px;position:sticky;top:92px;
}
.vial-price{font-family:var(--mono);font-size:2.1rem;letter-spacing:-.03em;line-height:1;}
.sizes{display:flex;flex-direction:column;gap:1px;background:var(--rule-fine);border:1px solid var(--rule-fine);margin:18px 0;}
.size{
  display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--glass);
  padding:13px 15px;cursor:pointer;border:0;width:100%;text-align:left;transition:background .15s;
}
.size:hover{background:var(--paper);}
.size[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
.size .mg{font-family:var(--mono);font-size:14px;}
.size .pr{font-family:var(--mono);font-size:14px;}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--rule);width:fit-content;margin-bottom:14px;}
.qty button{background:none;border:0;padding:9px 14px;cursor:pointer;font-size:16px;line-height:1;}
.qty button:hover{background:var(--paper-deep);}
.qty input{
  width:46px;border:0;border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  text-align:center;padding:9px 0;font-family:var(--mono);font-size:14px;background:transparent;
}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:24px;flex-wrap:wrap;}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  padding:11px 17px 11px 0;margin-right:22px;cursor:pointer;font-size:14.5px;color:var(--ink-mute);
  transition:color .16s,border-color .16s;
}
.tab:hover{color:var(--ink);}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);}
.panel[hidden]{display:none;}

/* assay table */
.assay{width:100%;border-collapse:collapse;font-size:14px;}
.assay caption{text-align:left;font-size:12.5px;color:var(--ink-mute);padding-bottom:10px;}
.assay th{
  text-align:left;font-weight:500;font-size:12.5px;color:var(--ink-mute);
  padding:8px 14px 8px 0;border-bottom:2px solid var(--ink);
}
.assay td{padding:11px 14px 11px 0;border-bottom:1px solid var(--rule-fine);font-family:var(--mono);font-size:13.5px;}
.assay td:first-child{font-family:var(--sans);font-size:14px;}
.assay .pass{color:var(--sage);}

/* reconstitution calculator */
.calc{background:var(--glass);border:1px solid var(--rule);padding:24px;}
.calc-row{display:grid;grid-template-columns:1fr 120px;gap:14px;align-items:center;margin-bottom:14px;}
.calc label{font-size:14px;color:var(--ink-soft);}
.calc input,.calc select{
  font-family:var(--mono);font-size:14px;padding:9px 11px;border:1px solid var(--rule);
  background:var(--paper);border-radius:1px;width:100%;
}
.calc-out{border-top:2px solid var(--ink);margin-top:20px;padding-top:16px;display:grid;gap:12px;}
.calc-out .line{display:flex;justify-content:space-between;align-items:baseline;gap:16px;}
.calc-out .k{font-size:13.5px;color:var(--ink-mute);}
.calc-out .v{font-family:var(--mono);font-size:1.06rem;}
.calc-out .v-lead{font-size:1.6rem;letter-spacing:-.02em;}

/* ---------- matcher ---------- */
.matcher{max-width:760px;margin:0 auto;padding:clamp(36px,5vw,60px) 0 clamp(60px,8vw,100px);}
.mprog{display:flex;gap:5px;margin-bottom:34px;}
.mprog span{height:2px;flex:1;background:var(--rule);transition:background .34s var(--ease);}
.mprog span.on{background:var(--gold);}
.mstep{animation:mIn .4s var(--ease) both;}
@keyframes mIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
.mq{font-family:var(--display);font-size:clamp(1.6rem,3.1vw,2.3rem);line-height:1.12;letter-spacing:-.015em;margin-bottom:10px;}
.mhint{color:var(--ink-mute);font-size:14.5px;margin-bottom:26px;}
.mopts{display:grid;gap:1px;background:var(--rule-fine);border:1px solid var(--rule-fine);margin-bottom:26px;}
.mopt{
  background:var(--paper);border:0;padding:18px 20px;text-align:left;cursor:pointer;
  display:flex;gap:16px;align-items:flex-start;transition:background .16s;
}
.mopt:hover{background:var(--glass);}
.mopt[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
.mopt[aria-pressed="true"] .mopt-d{color:var(--sage-pale);}
.mopt-k{font-family:var(--mono);font-size:11.5px;opacity:.6;padding-top:3px;min-width:18px;}
.mopt-t{font-size:15.5px;font-weight:500;}
.mopt-d{font-size:13.5px;color:var(--ink-mute);margin-top:3px;}
.mnav{display:flex;justify-content:space-between;gap:14px;align-items:center;}
.mback{background:none;border:0;cursor:pointer;color:var(--ink-mute);font-size:14px;padding:8px 0;}
.mback:hover{color:var(--ink);}

/* results */
.mres{animation:mIn .45s var(--ease) both;}
.match{border-top:2px solid var(--ink);padding:24px 0;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:start;}
.match+.match{border-top:1px solid var(--rule-fine);}
.mscore{text-align:center;min-width:74px;}
.mscore .n{font-family:var(--mono);font-size:1.9rem;line-height:1;letter-spacing:-.03em;}
.mscore .l{font-size:10.5px;color:var(--ink-mute);margin-top:4px;}
.mbar{height:2px;background:var(--rule);margin-top:9px;overflow:hidden;}
.mbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .8s var(--ease);}
.mwhy{margin-top:12px;display:grid;gap:7px;}
.mwhy li{font-size:13.5px;color:var(--ink-soft);display:flex;gap:9px;list-style:none;}
.mwhy li::before{content:'';width:5px;height:5px;background:var(--gold);margin-top:8px;flex:none;}
.mwhy{padding:0;margin-left:0;}

/* ---------- cart ---------- */
.cart-line{display:grid;grid-template-columns:1fr auto auto auto;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--rule-fine);}
.cart-line:first-child{border-top:2px solid var(--ink);}
.cart-name{font-family:var(--display);font-size:1.16rem;text-decoration:none;}
.cart-size{font-family:var(--mono);font-size:12.5px;color:var(--ink-mute);margin-top:2px;}
.cart-rm{background:none;border:0;cursor:pointer;color:var(--ink-mute);font-size:13px;text-decoration:underline;padding:4px;}
.cart-rm:hover{color:var(--rust);}
.totals{margin-top:26px;padding-top:20px;border-top:2px solid var(--ink);max-width:380px;margin-left:auto;}
.totals .line{display:flex;justify-content:space-between;gap:20px;padding:7px 0;font-size:14.5px;}
.totals .line.grand{border-top:1px solid var(--rule);margin-top:9px;padding-top:14px;font-size:1.12rem;}
.totals .num{font-family:var(--mono);}

/* ---------- notices ---------- */
.notice{
  border-left:2px solid var(--gold);background:rgba(168,121,27,.06);
  padding:16px 20px;font-size:14px;color:var(--ink-soft);
}
.notice strong{color:var(--ink);font-weight:600;}
.notice-hard{border-left-color:var(--rust);background:rgba(140,74,47,.06);}

/* ---------- footer ---------- */
.foot{background:var(--ink);color:var(--sage-pale);padding:clamp(48px,6vw,76px) 0 30px;font-size:14px;}
.foot a{color:var(--sage-pale);text-decoration:none;}
.foot a:hover{color:var(--paper);}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:36px;padding-bottom:38px;border-bottom:1px solid rgba(185,198,188,.2);}
.foot h4{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--paper);margin:0 0 14px;letter-spacing:.01em;}
.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:9px;}
.foot .fmark{font-family:var(--display);font-size:1.3rem;color:var(--paper);letter-spacing:-.02em;}
.foot .fmark .inf{color:var(--gold);}
.foot .fblurb{margin-top:12px;max-width:34ch;color:var(--sage-pale);font-size:13.5px;}
.legal{padding-top:26px;font-size:12.5px;line-height:1.65;color:#8FA096;display:grid;gap:12px;}
.legal p{max-width:none;}
.legal strong{color:var(--sage-pale);}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .hero-grid{grid-template-columns:1fr;}
  .pd{grid-template-columns:1fr;}
  .vial{position:static;}
  .dual{grid-template-columns:1fr;}
  .foot-grid{grid-template-columns:1fr 1fr;}
}
@media (max-width:760px){
  .navtoggle{display:block;}
  .wordmark .sub{display:none;}
  .wordmark .mark{font-size:1.12rem;white-space:nowrap;}
  .masthead-in{gap:14px;}
  .nav{
    display:none;position:absolute;top:68px;left:0;right:0;background:var(--paper);
    border-bottom:1px solid var(--rule);flex-direction:column;align-items:stretch;
    gap:0;padding:8px var(--gut) 18px;
  }
  .nav.open{display:flex;}
  .nav a{padding:12px 0;border-bottom:1px solid var(--rule-fine);}
  .spec{grid-template-columns:1fr auto;gap:14px 16px;}
  .spec-idx{display:none;}
  .spec-sizes{grid-column:1/-1;align-items:flex-start;}
  .spec-sizes .row{gap:10px;}
  .spec-buy{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;width:100%;}
  .match{grid-template-columns:1fr;gap:14px;}

/* ---------- cart (localStorage) ---------- */
const Cart = {
  key:'svl.cart.v1',
  read(){
    try{ return JSON.parse(localStorage.getItem(this.key)) || []; }
    catch(e){ return []; }
  },
  write(items){
    try{ localStorage.setItem(this.key, JSON.stringify(items)); }catch(e){}
    this.paint();
    document.dispatchEvent(new CustomEvent('cart:change'));
  },
  add(sku, mg, qty=1){
    const items = this.read();
    const hit = items.find(i=>i.sku===sku && i.mg===mg);
    if(hit) hit.qty += qty; else items.push({sku,mg,qty});
    this.write(items);
    if(typeof Drawer !== 'undefined' && Drawer.built) Drawer.open();
  },
  setQty(sku,mg,qty){
    let items = this.read();
    if(qty<=0) items = items.filter(i=>!(i.sku===sku && i.mg===mg));
    else{ const hit = items.find(i=>i.sku===sku && i.mg===mg); if(hit) hit.qty = qty; }
    this.write(items);
  },
  remove(sku,mg){ this.write(this.read().filter(i=>!(i.sku===sku && i.mg===mg))); },
  clear(){ this.write([]); },
  count(){ return this.read().reduce((n,i)=>n+i.qty,0); },
  detailed(){
    return this.read().map(i=>{
      const p = bySku(i.sku); if(!p) return null;
      const size = p.sizes.find(s=>s.mg===i.mg) || p.sizes[0];
      return {...i, product:p, size, line: size.price * i.qty};
    }).filter(Boolean);
  },
  subtotal(){ return this.detailed().reduce((n,i)=>n+i.line,0); },
  shipping(){ const s=this.subtotal(); return s===0||s>=SVL.freeShipOver ? 0 : SVL.shipFlat; },
  total(){ return this.subtotal() + this.shipping(); },
  paint(){
    const n = this.count();
    $$('[data-cart-count]').forEach(el=>{
      el.textContent = n;
      if(el.classList.contains('badge')) el.hidden = (n === 0);
    });
    const fab = document.getElementById('cartFab');
    if(fab) fab.setAttribute('aria-label', n ? `Open cart, ${n} item${n>1?'s':''}` : 'Open cart');
  }
};

/* ---------- entry gate ----------------------------------------------
   Age + research-use acknowledgement. Shown once per browser, then
   remembered. Both boxes must be ticked before Enter unlocks.          */
const Gate = {
  key:'svl.gate.v1',

  passed(){
    try { return !!localStorage.getItem(this.key); } catch(e){ return false; }
  },

  mount(){
    if(this.passed()) return;
    if(document.querySelector('.gate')) return;   // router may re-render the shell

    const el = document.createElement('div');
    el.className = 'gate';
    el.setAttribute('role','dialog');
    el.setAttribute('aria-modal','true');
    el.setAttribute('aria-labelledby','gateTitle');
    el.innerHTML = `
      <div class="gate-panel">
        <div class="gate-mark"><span class="inf">&#8734;</span><span class="nm">SempreViva Labs</span></div>
        <h2 id="gateTitle">Before you enter</h2>
        <p class="lede">Two things to confirm. Both are required.</p>
        <div class="gate-checks">
          <label class="gate-check">
            <input type="checkbox" id="gAge">
            <span>I am 21 years of age or older.</span>
          </label>
          <label class="gate-check">
            <input type="checkbox" id="gUse">
            <span>I understand these products are sold for laboratory research use only &mdash; they are not drugs, supplements or cosmetics, and they are not for human or veterinary use.</span>
          </label>
        </div>
        <div class="gate-acts">
          <button class="btn btn-gold" id="gEnter" disabled>Enter</button>
          <button class="btn btn-ghost" id="gLeave">Leave</button>
        </div>
        <p class="gate-foot">Nothing on this site is medical advice, and no product is offered to diagnose, treat, cure or prevent any disease. Purchasers are responsible for handling these materials under applicable law.</p>
      </div>`;
    document.body.appendChild(el);

    const age = el.querySelector('#gAge'),
          use = el.querySelector('#gUse'),
          go  = el.querySelector('#gEnter');

    const sync = () => { go.disabled = !(age.checked && use.checked); };
    age.addEventListener('change', sync);
    use.addEventListener('change', sync);

    go.addEventListener('click', ()=>{
      if(go.disabled) return;
      try { localStorage.setItem(Gate.key, new Date().toISOString()); } catch(e){}
      el.remove();
    });

    el.querySelector('#gLeave').addEventListener('click', ()=>{
      el.querySelector('.gate-panel').outerHTML = `
        <div class="gate-panel gate-declined">
          <div class="gate-mark" style="justify-content:center"><span class="inf">&#8734;</span><span class="nm">SempreViva Labs</span></div>
          <h2>Thanks for stopping by</h2>
          <p class="lede" style="margin:0">This site is limited to research buyers aged 21 and over. You can close this tab.</p>
        </div>`;
    });

    // keep focus inside the dialog while it is up
    el.addEventListener('keydown', e=>{
      if(e.key !== 'Tab') return;
      const f = [...el.querySelectorAll('input,button')].filter(x=>!x.disabled);
      if(!f.length) return;
      const first = f[0], last = f[f.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    });
    setTimeout(()=>age.focus(), 60);
  }
};

const Drawer = {

     the cart, singles before blends, cheapest first. */
  recommended(n=3){
    const inCart = new Set(Cart.read().map(i=>i.sku));
    const cats   = new Set(Cart.detailed().map(i=>i.product.cat));
    return PRODUCTS
      .filter(p => !inCart.has(p.sku))
      .map(p => ({p, s:(cats.has(p.cat)?2:0) + (p.blend?0:1)}))
      .sort((a,b) => b.s - a.s || lowest(a.p) - lowest(b.p))
      .slice(0, n)
      .map(x => x.p);
  },

  build(){
    if(this.built) return;
    this.built = true;

    const fab = document.createElement('button');
    fab.className = 'cartfab';
    fab.id = 'cartFab';
    fab.setAttribute('aria-label','Open cart');

    const scrim = document.createElement('div');
    scrim.className = 'cartscrim';

    const panel = document.createElement('aside');
    panel.className = 'cartdrawer';
    panel.id = 'cartDrawer';
    panel.setAttribute('role','dialog');

    panel.setAttribute('aria-label','Cart');

      </div>

    document.body.append(fab, scrim, panel);

    panel.querySelector('#cdClose').addEventListener('click', ()=>this.close());

    document.addEventListener('keydown', e=>{
      if(e.key === 'Escape' && panel.classList.contains('open')) this.close();

    // quantity, remove and quick-add all live inside the panel
    panel.addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return;

    s.classList.remove('open');

    const f = document.getElementById('cartFab'); if(f) f.focus();
  }
};

/* ---------- chromatogram (hero) ---------- */
function drawChromatogram(host, opts={}){
  const W=560, H=210, base=H-26;
  const peaks = opts.peaks || [
    {x:118,h:14,w:11},{x:168,h:9,w:9},{x:286,h:152,w:23},{x:352,h:11,w:9},{x:430,h:7,w:8}
  ];
  const main = peaks.reduce((a,b)=>b.h>a.h?b:a);

  // build the trace as a sum of gaussians
  let d='';
  for(let x=28;x<=W-14;x+=1.6){
    let y=base;
    peaks.forEach(p=>{ y -= p.h * Math.exp(-Math.pow(x-p.x,2)/(2*p.w*p.w)); });
    y -= Math.sin(x/9)*0.5; // faint baseline noise
    d += (d?'L':'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
  }
  let fill = 'M'+(main.x-main.w*2.6)+' '+base+' ';
  for(let x=main.x-main.w*2.6;x<=main.x+main.w*2.6;x+=1.4){
    let y=base; peaks.forEach(p=>{ y -= p.h*Math.exp(-Math.pow(x-p.x,2)/(2*p.w*p.w)); });
    fill += 'L'+x.toFixed(1)+' '+y.toFixed(1)+' ';
  }
  fill += 'L'+(main.x+main.w*2.6)+' '+base+' Z';

  const grid = [0,1,2,3].map(i=>`<line class="grid" x1="28" y1="${34+i*38}" x2="${W-14}" y2="${34+i*38}"/>`).join('');

  host.innerHTML = `
    <div class="chroma-head">
      <span class="t">RP-HPLC &middot; 214 nm</span>
      <span class="t">${opts.lot || 'lot SV-0000'}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chromatogram showing a single dominant peak at 99.2 percent of total area">
      ${grid}
      <path class="peakfill" d="${fill}" opacity="0"/>
      <path class="trace" d="${d}"/>
      <line class="axis" x1="28" y1="${base}" x2="${W-14}" y2="${base}"/>
      <line class="axis" x1="28" y1="18" x2="28" y2="${base}"/>
      <line class="callout" x1="${main.x}" y1="${base-main.h-8}" x2="${main.x}" y2="24" opacity="0"/>
    </svg>
    <div class="chroma-read">
      <span class="big" id="chromaPct">0.0%</span>
      <span class="lbl">of total peak area &middot; single dominant species</span>
    </div>
    <div class="chroma-foot"><span>0.0 min</span><span>retention &rarr;</span><span>24.0 min</span></div>`;

  const path = host.querySelector('.trace');
  const pct  = host.querySelector('#chromaPct');
  const fillEl = host.querySelector('.peakfill');
  const call = host.querySelector('.callout');
  const target = opts.purity ?? 99.2;

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    pct.textContent = target.toFixed(1)+'%';
    fillEl.setAttribute('opacity','1'); call.setAttribute('opacity','1');
    return;
  }

  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.animate([{strokeDashoffset:len},{strokeDashoffset:0}],
    {duration:2100, easing:'cubic-bezier(.25,.6,.2,1)', fill:'forwards'});

  setTimeout(()=>{
    fillEl.animate([{opacity:0},{opacity:1}],{duration:620,fill:'forwards'});
    call.animate([{opacity:0},{opacity:1}],{duration:620,fill:'forwards'});
    const t0 = performance.now(), dur = 900;
    (function tick(now){
      const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
      pct.textContent = (target*e).toFixed(1)+'%';
      if(k<1) requestAnimationFrame(tick);
    })(t0);
  }, 1500);
}



/* Compound matcher — deterministic scoring over the register.
   Asks about research design only. Never about symptoms or health status. */

const QUESTIONS = [
  { id:'area', q:'What is the research area?',
    hint:'This carries the most weight in the scoring.',
    opts:[
      ['metabolic','Metabolic and growth axis','Incretin signalling, energy expenditure, growth-hormone release'],
      ['tissue','Tissue and structural','Connective tissue, matrix, structural repair models'],
      ['dermal','Dermal and pigment','Skin, follicle, matrix proteins, melanocortin pigment pathways'],
      ['cellular','Cellular and mitochondrial','Mitochondrial signalling, redox cofactors, innate repair receptor'],
      ['neuroendocrine','Neuroendocrine','Hypothalamic–pituitary signalling, melanocortin receptors']
    ]},
  { id:'form', q:'Single compound, or a blend?',
    hint:'Blends need a ratio verification on top of the purity assay.',
    opts:[
      ['single','A single compound','One molecule, one assay, cleanest attribution'],
      ['blend','A verified blend','Several compounds co-lyophilised at a measured ratio'],
      ['either','No preference','Score both and let the other answers decide']
    ]},
  { id:'window', q:'How long is the study window?',
    hint:'Shorter-acting compounds suit shorter windows.',
    opts:[
      ['short','Short — under four weeks','Fast-clearing compounds, tight observation window'],
      ['standard','Standard — eight to twelve weeks','The usual planning horizon'],
      ['extended','Extended — beyond twelve weeks','Longer half-life or larger vial sizes preferred']
    ]},
  { id:'depth', q:'How familiar are you with this class?',
    hint:'Affects how much handling complexity the shortlist assumes.',
    opts:[
      ['entry','First protocol with it','Favour simple, well-characterised, single-component entries'],
      ['standard','Some prior work','Comfortable with reconstitution and standard handling'],
      ['advanced','Extensive','Multi-component blends and complex handling are fine']
    ]},
  { id:'budget', q:'Budget per vial?',
    hint:'Filters on the lowest available size for each entry.',
    opts:[
      ['30','Up to $30',''],
      ['50','Up to $50',''],
      ['75','Up to $75',''],
      ['999','No constraint','']
    ]},
  { id:'route', q:'Any handling constraint?',
    hint:'Everything in the register ships lyophilised and is reconstituted before use.',
    opts:[
      ['any','None','Standard reconstitution is fine'],
      ['topical','Prefer topical-compatible','Favour compounds also used in topical preparations'],
      ['simple','Simplest possible','Single component, one step, no ratio to track']
    ]}
];

const ADJ = { short:['standard'], standard:['short','extended'], extended:['standard'] };
const DEPTH_ORDER = ['entry','standard','advanced'];

function score(p, ans){
  let pts = 0; const why = [];

  // research area — heaviest weight
  if(p.areas[0] === ans.area){ pts += 42; why.push(`Primary fit for ${CATEGORIES.find(c=>c.id===ans.area).label.toLowerCase()}`); }
  else if(p.areas.includes(ans.area)){ pts += 24; why.push(`Secondary activity in ${CATEGORIES.find(c=>c.id===ans.area).label.toLowerCase()}`); }

  // single vs blend
  if(ans.form === 'either'){ pts += 10; }
  else if((ans.form==='blend') === p.blend){
    pts += 20;
    why.push(p.blend ? 'Blend, with per-lot ratio verification' : 'Single component — one assay, clean attribution');
  }
  else { pts -= 12; }   // stated a preference and this is the other kind

  // study window
  if(p.window === ans.window){ pts += 13; why.push(`Suits a ${ans.window==='short'?'short':ans.window} study window`); }
  else if((ADJ[ans.window]||[]).includes(p.window)){ pts += 6; }

  // familiarity
  const gap = Math.abs(DEPTH_ORDER.indexOf(p.depth) - DEPTH_ORDER.indexOf(ans.depth));
  if(gap===0){ pts += 15; why.push('Handling complexity matches your stated experience'); }
  else if(gap===1){ pts += 7; }

  // budget
  const low = lowest(p), cap = +ans.budget;
  if(low <= cap){ pts += 18; if(cap!==999) why.push(`${money(low)} — inside your ${money(cap)} ceiling`); }
  else { pts -= 14; }

  // handling
  if(ans.route === 'any'){ pts += 8; }
  else if(ans.route === 'topical' && p.route === 'topical-or-reconstituted'){ pts += 16; why.push('Also used in topical preparations'); }
  else if(ans.route === 'simple' && !p.blend){ pts += 14; why.push('Single-step handling, no ratio to track'); }
  else if(ans.route === 'simple' && p.blend){ pts -= 10; }

  return { p, pts, why: why.slice(0,4) };
}

function rank(ans){
  const all = PRODUCTS.map(p=>score(p,ans)).sort((a,b)=>b.pts-a.pts);
  const max = all[0].pts || 1;
  return all.map(r=>({...r, norm: Math.max(0, Math.round((r.pts/max)*100))}));
}

   ------------------------------------------------------------
   The cart, totals, shipping form and validation are all live.
   Only the payment authorisation step is unwired.

   To connect a processor, replace the body of Processor.charge()
   below. It receives:
     order = {
       items:   [{sku, name, mg, qty, unitPrice, lineTotal}],
       subtotal, shipping, total,          // all in USD
       customer:{name,email,phone},
       ship:{line1,line2,city,state,zip,country},
       acknowledged: true
     }
   and must return a Promise resolving to
     { ok:true, reference:'<processor order id>' }
   or rejecting with an Error whose message is shown to the buyer.

   NOTE ON PROCESSORS: Stripe, PayPal, Square and Shopify Payments
   all prohibit research chemicals and peptides in their acceptable
   use policies. A high-risk merchant account is required for this
   category. Do not wire a prohibited processor — accounts in this
   category get frozen with the balance held.
   ============================================================ */

const Processor = {
  connected: false,

  async charge(order){
    if(!this.connected){
      throw new Error(
        'Online payment is not connected yet. Your order details have been saved below — ' +
        'send them to support@semprevivalabs.com or call (816) 641-7377 to complete the order.'
      );
    }
    /* ---- INTEGRATION POINT -------------------------------
       const res = await fetch('/api/checkout', {
         method:'POST',
         headers:{'Content-Type':'application/json'},
         body: JSON.stringify(order)
       });
       if(!res.ok) throw new Error(await res.text());
       return await res.json();      // { ok:true, reference:'...' }
       ------------------------------------------------------ */
  }
};

const Checkout = {
  buildOrder(form){
    const items = Cart.detailed().map(i=>({
      sku:i.sku, name:i.product.name, mg:i.mg,
      size: i.size.label || (i.mg + ' mg'),   // blends carry their real split
      qty:i.qty, unitPrice:i.size.price, lineTotal:i.line
    }));
    return {
      items,
      subtotal: Cart.subtotal(),
      shipping: Cart.shipping(),
      total: Cart.total(),
      customer:{ name:form.name, email:form.email, phone:form.phone },
      ship:{ line1:form.line1, line2:form.line2, city:form.city,
             state:form.state, zip:form.zip, country:'US' },
      acknowledged: form.ack,
      placedAt: new Date().toISOString()
    };
  },

  summarise(order){
    const L = [];
    L.push('ORDER — SempreViva Labs');
    L.push('Placed: ' + new Date(order.placedAt).toLocaleString());
    L.push('');
    order.items.forEach(i=>{
      L.push(`${i.qty} x  ${i.name}  ${i.size}   ${money(i.unitPrice)}   = ${money(i.lineTotal)}`);
    });
    L.push('');
    L.push('Subtotal  ' + money(order.subtotal));
    L.push('Shipping  ' + (order.shipping ? money(order.shipping) : 'Free'));
    L.push('Total     ' + money(order.total));
    L.push('');
    L.push(order.customer.name);
    L.push(order.customer.email + '  ' + order.customer.phone);
    L.push(order.ship.line1 + (order.ship.line2 ? ', ' + order.ship.line2 : ''));
    L.push(order.ship.city + ', ' + order.ship.state + ' ' + order.ship.zip);
    L.push('');
    L.push('Research use only acknowledged: yes');
    return L.join('\n');
  }
};

  }

  testing: '<main>\n\n  <section class="sec sec-tight" style="border-bottom:0;padding-bottom:0">\n    <div class="shell">\n      <div class="sec-head">\n        <h1 style="font-size:clamp(2.3rem,4.6vw,3.6rem)">What we test, and what the numbers mean</h1>\n        <p>All products are tested for purity, mass measurements, and blend ratios here in the United States. This page explains what each of those tests actually establishes — and what it does not.</p>\n      </div>\n    </div>\n  </section>\n\n  <section class="sec">\n    <div class="shell dual">\n      <div class="rail">\n        <dl>\n          <dt>Identity</dt><dd>ESI-MS</dd>\n          <dt>Purity</dt><dd>RP-HPLC, 214 nm</dd>\n          <dt>Net peptide</dt><dd>Nitrogen determination</dd>\n          <dt>Water</dt><dd>Karl Fischer</dd>\n          <dt>Blend ratio</dt><dd>RP-HPLC, per component</dd>\n          <dt>Appearance</dt><dd>Visual</dd>\n          <dt>Location</dt><dd>United States</dd>\n        </dl>\n      </div>\n      <div class="stack" style="--sp:36px">\n        <div id="identity">\n          <h2 style="margin-bottom:12px">Identity comes first</h2>\n          <p>Mass spectrometry ionises the sample and measures mass-to-charge ratio. The observed mass either matches the expected mass for the sequence or it does not. This is the test that answers "is this the molecule on the label."</p>\n          <p>It gets skipped more often than it should, because purity is the number people look for. But purity is a ratio of one peak to all peaks — it describes how dominant the main species is, not what that species is. A sample can be 99% one compound and that compound can be the wrong one.</p>\n        </div>\n\n        <div id="purity">\n          <h2 style="margin-bottom:12px">Purity is a method, not a number</h2>\n          <p>Reversed-phase HPLC pushes the sample through a packed column under pressure. Components that interact more strongly with the stationary phase come out later. A detector at the far end records absorbance, and each species draws a peak.</p>\n          <p>Area percent is the area under the main peak divided by the total area under all peaks. Change the wavelength, the gradient, or the column and the same vial gives a different figure — which is why we publish the method and the detection wavelength next to the percentage. A purity number with no method attached cannot be compared to anything.</p>\n          <p>There is a second trap. Area percent, net peptide content, and total weight purity are three different measurements that all get printed as a percentage. A vial can read 99% by HPLC and still be a substantial fraction salt and residual water by mass, because HPLC only sees what absorbs at that wavelength. Net peptide content is the figure that tells you how much peptide you actually bought.</p>\n        </div>\n\n        <div id="ratio">\n          <h2 style="margin-bottom:12px">Blends need a fourth test</h2>\n          <p>When three compounds share a vial, purity tells you how clean the contents are and identity tells you the components are the right ones. Neither tells you the proportion.</p>\n          <p>Fill weight is not proof of ratio. Two powders can be weighed correctly and still separate, settle, or partition unevenly during lyophilisation. Ratio verification runs the reconstituted blend through HPLC and integrates each component peak separately, so the stated split is measured rather than assumed.</p>\n          <p>Every blend in the register — Wolverine, Deadpool, Glow, and Klow — carries one.</p>\n        </div>\n\n        <div id="handling">\n          <h2 style="margin-bottom:12px">Lyophilisation, and the clock it stops</h2>\n          <p>Freeze-drying removes water by sublimation: the sample is frozen, then held under vacuum so ice passes straight to vapour without melting. Skipping the liquid phase is the point — liquid water drives hydrolysis, and hydrolysis is what breaks peptide bonds.</p>\n          <p>The result is a dry cake that is stable at room temperature in transit and keeps far longer frozen. Adding diluent restarts the clock the dry state had stopped. After that: 2–8&nbsp;°C, out of the light, and as few freeze–thaw cycles as the work allows.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class="sec" id="coa">\n    <div class="shell">\n      <div class="sec-head">\n        <h2>COA lookup</h2>\n        <p>Every vial carries a lot number on the label. Enter it to pull the certificate of analysis for that specific lot — not a representative document for the product line.</p>\n      </div>\n      <form id="coaForm" style="display:flex;gap:12px;flex-wrap:wrap;max-width:560px">\n        <input id="coaLot" type="text" placeholder="Lot number, e.g. SV-BPC-0000" aria-label="Lot number"\n               style="flex:1;min-width:240px;font-family:var(--mono);font-size:14px;padding:13px 14px;border:1px solid var(--rule);background:var(--glass);border-radius:1px">\n        <button class="btn" type="submit">Look up</button>\n      </form>\n      <div id="coaOut" style="margin-top:22px;max-width:640px"></div>\n    </div>\n  </section>\n\n</main>',

rgin-top:18px"></div>\n          </form>\n        </div>\n      </div>\n    </div>\n  </section>\n</main>',

  matcher: function(){

  const stage = document.getElementById('stage');
  const prog  = document.getElementById('prog');
  const ans = {};
  let step = 0;

  prog.innerHTML = QUESTIONS.map(()=>'<span></span>').join('');

  function paintProg(){
    [...prog.children].forEach((s,i)=>s.classList.toggle('on', i<=step && step<QUESTIONS.length));
  }

  function renderQ(){
    const Q = QUESTIONS[step];
    paintProg();
    stage.innerHTML = `
      <div class="mstep">
        <p class="num" style="font-size:12px;color:var(--ink-mute);margin-bottom:14px">
          ${String(step+1).padStart(2,'0')} / ${String(QUESTIONS.length).padStart(2,'0')}
        </p>
        <h1 class="mq">${Q.q}</h1>
        <p class="mhint">${Q.hint}</p>
        <div class="mopts" role="group">
          ${Q.opts.map(([v,t,d],i)=>`
            <button class="mopt" data-v="${v}" aria-pressed="${ans[Q.id]===v}">
              <span class="mopt-k">${String.fromCharCode(65+i)}</span>
              <span><span class="mopt-t">${t}</span>${d?`<span class="mopt-d" style="display:block">${d}</span>`:''}</span>
            </button>`).join('')}
        </div>
        <div class="mnav">
          <button class="mback" id="back" ${step===0?'style="visibility:hidden"':''}>&larr; Back</button>
          <span class="num" style="font-size:12px;color:var(--ink-mute)">Press A–E or click</span>
        </div>
      </div>`;

    stage.querySelectorAll('.mopt').forEach(b=>b.addEventListener('click', ()=>pick(b.dataset.v)));
    const back = document.getElementById('back');
    if(back) back.addEventListener('click', ()=>{ if(step>0){ step--; renderQ(); } });
  }

  function pick(v){
    ans[QUESTIONS[step].id] = v;
    step++;
    if(step < QUESTIONS.length) renderQ(); else renderResults();
  }

  document.addEventListener('keydown', e=>{
    if(step >= QUESTIONS.length) return;
    const i = e.key.toUpperCase().charCodeAt(0) - 65;
    const opts = QUESTIONS[step].opts;
    if(i>=0 && i<opts.length && !e.metaKey && !e.ctrlKey) pick(opts[i][0]);
    if(e.key==='Backspace' && step>0){ e.preventDefault(); step--; renderQ(); }
  });

  function renderResults(){
    paintProg();
    const ranked = rank(ans);
    // Only compounds that actually sit in the chosen research area go on the
    // shortlist. If the area holds fewer than three, show fewer rather than
    // padding it out with something from a different area.
    const inArea = ranked.filter(r => r.p.areas.includes(ans.area));
    const top  = (inArea.length ? inArea : ranked).slice(0,3);
    const rest = ranked.filter(r => !top.includes(r)).slice(0,3);
    const WORD = {1:'One that fits', 2:'Two that fit', 3:'Three that fit'};
    const areaName = CATEGORIES.find(c=>c.id===ans.area).label.toLowerCase();

    stage.innerHTML = `
      <div class="mres">
        <p class="num" style="font-size:12px;color:var(--ink-mute);margin-bottom:14px">Result</p>
        <h1 class="mq" style="margin-bottom:12px">${WORD[top.length] || 'What fits'}</h1>
        <p class="mhint" style="margin-bottom:36px">
          Scored across all sixteen entries on research area, form, study window, handling complexity, and price ceiling. Area carries the most weight.${top.length < 3 ? ` The register holds ${top.length === 1 ? 'only one compound' : 'only ' + top.length + ' compounds'} in ${areaName}, so the shortlist is short.` : ''}
        </p>

        ${top.map(r=>`
          <article class="match">
            <div class="mscore">
              <div class="n">${r.norm}</div>
              <div class="l">score</div>
              <div class="mbar"><i data-w="${r.norm}"></i></div>
            </div>
            <div>
              <a href="#/product/${r.p.sku}" style="font-family:var(--display);font-size:1.5rem;text-decoration:none;letter-spacing:-.015em">${r.p.name}</a>
              <p style="font-size:14px;color:var(--ink-mute);margin:5px 0 0">${r.p.klass}</p>
              <ul class="mwhy">${r.why.map(w=>`<li>${w}</li>`).join('')}</ul>
            </div>
            <div style="text-align:right">
              <div class="num" style="font-size:1.2rem">${money(lowest(r.p))}</div>
              <a class="btn btn-ghost btn-sm" style="margin-top:10px" href="#/product/${r.p.sku}">View</a>
            </div>
          </article>`).join('')}

        <details style="margin-top:40px;border-top:1px solid var(--rule);padding-top:20px">
          <summary style="cursor:pointer;font-size:14.5px;color:var(--ink-soft)">Why the next ${rest.length} scored lower</summary>
          <div style="margin-top:18px;display:grid;gap:14px">
            ${rest.map(r=>`
              <div style="display:flex;gap:16px;align-items:baseline;font-size:14px">
                <span class="num" style="color:var(--ink-mute);min-width:34px">${r.norm}</span>
                <span><a href="#/product/${r.p.sku}" style="color:inherit">${r.p.name}</a>
                <span style="color:var(--ink-mute)"> — ${r.why[0] || 'outside the stated research area'}${lowest(r.p) > +ans.budget ? `, and ${money(lowest(r.p))} is over your ceiling` : ''}</span></span>
              </div>`).join('')}
          </div>
        </details>

        <div style="margin-top:40px;display:flex;gap:12px;flex-wrap:wrap">
          <a class="btn" href="#/shop">See the full register</a>
          <button class="btn btn-ghost" id="again">Start over</button>
        </div>

        <div class="notice" style="margin-top:36px">
          <p style="margin:0">This is a catalogue filter, not advice. It ranks sixteen products against six answers about study design and nothing else. All products are supplied for laboratory research use only.</p>
        </div>
      </div>`;

    requestAnimationFrame(()=>{
      stage.querySelectorAll('.mbar i').forEach(b=>{ b.style.width = b.dataset.w + '%'; });
    });
    document.getElementById('again').addEventListener('click', ()=>{
      step = 0; Object.keys(ans).forEach(k=>delete ans[k]); renderQ();
    });
  }

  renderQ();

  },

    const v = id => document.getElementById(id).value.trim();
    const order = Checkout.buildOrder({
      name:v('f_name'), email:v('f_email'), phone:v('f_phone'),
      line1:v('f_line1'), line2:v('f_line2'), city:v('f_city'),
      state:v('f_state').toUpperCase(), zip:v('f_zip'),
      ack: document.getElementById('f_ack').checked
    });
    const out = document.getElementById('coOut');
    const btn = document.getElementById('payBtn');
    btn.disabled = true;
    try{
      const res = await Processor.charge(order);
      out.innerHTML = `<div class="notice"><p style="margin:0"><strong>Order placed.</strong> Reference ${res.reference}.</p></div>`;
      Cart.clear();
    }catch(err){
      out.innerHTML = `
        <div class="notice notice-hard"><p style="margin:0">${err.message}</p></div>
        <details style="margin-top:14px">
          <summary style="cursor:pointer;font-size:13.5px;color:var(--ink-soft)">Show order details to send</summary>
          <pre class="num" style="white-space:pre-wrap;font-size:12px;background:var(--paper);border:1px solid var(--rule);padding:16px;margin-top:10px;line-height:1.6">${Checkout.summarise(order).replace(/[<>&]/g,'')}</pre>
          <button class="btn btn-ghost btn-sm" type="button" id="copyOrder" style="margin-top:10px">Copy to clipboard</button>
        </details>`;
      const cp = document.getElementById('copyOrder');
      if(cp) cp.addEventListener('click', ()=>{
        navigator.clipboard.writeText(Checkout.summarise(order)).then(()=>{ cp.textContent='Copied'; });
      });
    }finally{ btn.disabled = false; }
  });

  paint();

  },
  contact: function(){

document.getElementById('msg').addEventListener('submit', e=>{
  e.preventDefault();
  const g = id => document.getElementById(id).value.trim();
  const lot = g('cLot');
  const body = 'From: ' + g('cName') + ' <' + g('cEmail') + '>' + (lot ? '\nLot: ' + lot : '') + '\n\n' + g('cBody');
  location.href = 'mailto:support@semprevivalabs.com?subject=' +
    encodeURIComponent('Website enquiry' + (lot ? ' — lot ' + lot : '')) +
    '&body=' + encodeURIComponent(body);
});

  },
};

/* ---- hash router ---------------------------------------------------- */
function route(){
  const raw = (location.hash || '#/').replace(/^#\/?/, '');
  const [name, param] = raw.split('/');
  const page = name && VIEWS[name] ? name : 'index';
  window.__ROUTE_PARAM = param || null;

  document.getElementById('app').innerHTML = VIEWS[page];
  const navKey = page === 'product' ? 'shop' : page;   // product pages sit under Compounds
  renderShell(navKey === 'index' ? '#/' : '#/' + navKey);
  try { INITS[page](); } catch(e){ console.error('view init failed:', page, e); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
document.addEventListener('DOMContentLoaded', route);
if(document.readyState !== 'loading') route();

</script>
